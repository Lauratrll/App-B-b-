  function prepare(i){
    cour=ZONES[i];
    document.getElementById('desig').textContent=cour.designation;
    document.getElementById('desc').textContent='Petits cercles qui avancent \u2014 '+cour.sens+'.';
    toutesZones.forEach(g=>g.style.display=cour.ids.includes(g.id)?'':'none');
    toutesZones.filter(g=>cour.ids.includes(g.id)).forEach(g=>g.style.opacity=OP_REPOS);
    const att=new Set(['mvt-'+cour.nom+'-d','mvt-'+cour.nom+'-g']);
    toutesCouches.forEach(g=>g.style.display=att.has(g.id)?'':'none');
    Z={};
    ['d','g'].forEach(f=>{
      const tr=svg.getElementById('tr-'+cour.nom+'-'+f), L=tr.getTotalLength();
      tr.style.strokeDasharray=L; tr.style.strokeDashoffset=L; tr.style.visibility='hidden'; tr.style.strokeOpacity=OP_TRAINEE;
      Z[f]={tr,L,Lm:cour.L[f],fin:svg.getElementById('fin-'+cour.nom+'-'+f),dg:svg.getElementById('dg-'+cour.nom+'-'+f)};
    });
  }
  function reset(){ Object.values(Z).forEach(z=>{
    z.tr.style.strokeDashoffset=z.L; z.tr.style.visibility='hidden'; z.tr.style.strokeOpacity=OP_TRAINEE;
    z.fin.setAttribute('opacity',0); z.dg.setAttribute('opacity',0); }); }
  function renduPied(f,k){
    const z=Z[f];
    z.tr.style.visibility = k>0.004?'visible':'hidden';
    z.tr.style.strokeDashoffset = z.L*(1-k);
    const p=z.tr.getPointAtLength(z.L*k);
    z.dg.setAttribute('cx',p.x.toFixed(1)); z.dg.setAttribute('cy',p.y.toFixed(1));
    z.dg.setAttribute('opacity', (k>0.004 && k<0.999)?1:0);
  }
  function rendu(k){
    if(cour.enchaine){
      const Ld=Z.d.Lm, Lg=Z.g.Lm, tot=Ld+Lg;
      renduPied('d', Math.min(tot*k/Ld,1));
      renduPied('g', Math.max(0,Math.min((tot*k-Ld)/Lg,1)));
    } else { renduPied('d',k); renduPied('g',k); }
  }
  function finZone(v){ ['d','g'].forEach(f=>{ Z[f].fin.setAttribute('opacity',(OP_FIN*v).toFixed(3));
    Z[f].tr.style.strokeOpacity=OP_TRAINEE*(1-v); }); }
  function cacherDoigt(){ ['d','g'].forEach(f=>Z[f].dg.setAttribute('opacity',0)); }
  const phaseEl=document.getElementById('phase'), cycleEl=document.getElementById('cycle');
  let passe=0, etat='parcours', t0=performance.now(), tc=0, enPause=false, vitesse=1;
  function reinit(){ passe=0; etat='parcours'; tc=0; t0=performance.now(); reset(); }
  function boucle(now){
    requestAnimationFrame(boucle);
    if(enPause){ t0=now-tc/vitesse; return; }
    tc=(now-t0)*vitesse;
    if(etat==='parcours'){
      const k=Math.min(tc/cour.duree,1);
      rendu(k);
      phaseEl.textContent='Cercles progressifs';
      cycleEl.textContent='passage '+(passe+1)+' / '+cour.passages;
      if(passe===cour.passages-1 && k>SEUIL_FIN) finZone((k-SEUIL_FIN)/(1-SEUIL_FIN));
      if(k>=1){ passe++; t0=now; tc=0;
        if(passe>=cour.passages){ etat='fin'; finZone(1); cacherDoigt(); } else etat='efface'; }
    } else if(etat==='efface'){
      cacherDoigt();
      const e=Math.min(tc/T_EFFACE,1);
      ['d','g'].forEach(f=>{ Z[f].tr.style.strokeOpacity=OP_TRAINEE*(1-e); });
      if(e>=1){ reset(); etat='parcours'; t0=now; tc=0; }
    } else { phaseEl.textContent='Zone compl\u00e8te'; cycleEl.textContent='';
      if(tc>=T_FIN) reinit(); }
  }
  sel.onchange=e=>{ prepare(+e.target.value); reinit(); };
  const b=document.getElementById('play');
  b.onclick=()=>{ enPause=!enPause; b.textContent=enPause?'Reprendre':'Pause'; };
  document.getElementById('restart').onclick=reinit;
  document.getElementById('vitesse').oninput=e=>{ vitesse=parseFloat(e.target.value); };
  prepare(0); reinit(); requestAnimationFrame(boucle);
})();
</script></body></html>

  const OP_REPOS=0.3, OP_TRAINEE=0.75, OP_FIN=0.90, DOIGT=1.15, PLANCHER=0.18;
  const T_TRAIT=2600, T_SURF=9000, T_EFFACE=550, T_INTER=700, T_FIN=1600, SEUIL_FIN=0.85, PASSES=3;

  ['zone-digestive-d','zone-digestive-g'].forEach(i=>svg.getElementById(i).style.opacity=OP_REPOS);
  Array.from(svg.querySelectorAll('g[id^="zone-"]')).forEach(g=>{
    g.style.display=g.id.startsWith('zone-digestive')?'':'none'; });
  Array.from(svg.querySelectorAll('g[id^="mvt-"]')).forEach(g=>g.style.display='');

  function cum(pts){ let c=[0]; for(let i=1;i<pts.length;i++) c.push(c[i-1]+Math.hypot(pts[i][0]-pts[i-1][0],pts[i][1]-pts[i-1][1])); return c; }
  const P={};
  ['trait','surf'].forEach(part=>{ P[part]={};
    ['d','g'].forEach(f=>{
      const tr=svg.getElementById(`tr-${part}-${f}`), Lp=tr.getTotalLength();
      tr.style.strokeDasharray=Lp; tr.style.strokeDashoffset=Lp; tr.style.strokeOpacity=OP_TRAINEE;
      const pts=GEO[part][f].pts;
      P[part][f]={tr,Lp,pts,cum:cum(pts),fin:svg.getElementById(`fin-${part}-${f}`),dg:svg.getElementById(`dg-${part}-${f}`),
                  epMax:GEO[part][f].ep_max||0};
    });
  });
  function pointA(o,k){ const tot=o.cum[o.cum.length-1], cible=tot*k; let i=1;
    while(i<o.cum.length-1 && o.cum[i]<cible) i++;
    const a=o.pts[i-1],b=o.pts[i],seg=(o.cum[i]-o.cum[i-1])||1,t=Math.max(0,Math.min(1,(cible-o.cum[i-1])/seg));
    return {x:a[0]+(b[0]-a[0])*t,y:a[1]+(b[1]-a[1])*t,ep:(a[2]||0)+((b[2]||0)-(a[2]||0))*t}; }
  function resetPart(part){ ['d','g'].forEach(f=>{ const o=P[part][f];
    o.tr.style.strokeDashoffset=o.Lp; o.tr.style.visibility='hidden'; o.tr.style.strokeOpacity=OP_TRAINEE;
    o.fin.setAttribute('opacity',0); o.dg.setAttribute('opacity',0); }); }
  function resetTout(){ resetPart('trait'); resetPart('surf'); }
  function rendu(part,k){ ['d','g'].forEach(f=>{ const o=P[part][f];
    o.tr.style.visibility=k>0.004?'visible':'hidden';
    o.tr.style.strokeDashoffset=o.Lp*(1-k);
    const p=pointA(o,k);
    o.dg.setAttribute('cx',p.x.toFixed(1)); o.dg.setAttribute('cy',p.y.toFixed(1));
    if(part==='trait') o.dg.setAttribute('r', Math.max(p.ep*DOIGT,o.epMax*PLANCHER).toFixed(1));
    o.dg.setAttribute('opacity',(k>0.004&&k<0.999)?1:0); }); }
  function fige(part,v){ ['d','g'].forEach(f=>{ P[part][f].fin.setAttribute('opacity',(OP_FIN*v).toFixed(3));
    P[part][f].tr.style.strokeOpacity=OP_TRAINEE*(1-v); }); }
  function cacher(part){ ['d','g'].forEach(f=>P[part][f].dg.setAttribute('opacity',0)); }

  const phaseEl=document.getElementById('phase'), cycleEl=document.getElementById('cycle');
  let part='trait', passe=0, etat='glisse', t0=performance.now(), tc=0, enPause=false, vitesse=1;
  function reinit(){ part='trait'; passe=0; etat='glisse'; tc=0; t0=performance.now(); resetTout(); }

  function boucle(now){
    requestAnimationFrame(boucle);
    if(enPause){ t0=now-tc/vitesse; return; }
    tc=(now-t0)*vitesse;
    const dur = part==='trait'?T_TRAIT:T_SURF;

    if(etat==='glisse'){
      const k=Math.min(tc/dur,1);
      rendu(part,k);
      phaseEl.textContent = part==='trait'?'Pression glissée':'Petits cercles qui avancent';
      cycleEl.textContent = (part==='trait'?'trait · ':'grande zone · ')+`passage ${passe+1} / ${PASSES}`;
      if(passe===PASSES-1 && k>SEUIL_FIN) fige(part,(k-SEUIL_FIN)/(1-SEUIL_FIN));
      if(k>=1){ passe++; t0=now; tc=0;
        if(passe>=PASSES){ fige(part,1); cacher(part); passe=0;
          if(part==='trait'){ part='surf'; etat='inter'; } else etat='fin'; }
        else etat='efface'; }
    }
    else if(etat==='efface'){
      cacher(part);
      const e=Math.min(tc/T_EFFACE,1);
      ['d','g'].forEach(f=>{ P[part][f].tr.style.strokeOpacity=OP_TRAINEE*(1-e); });
      if(e>=1){ resetPart(part); etat='glisse'; t0=now; tc=0; }
    }
    else if(etat==='inter'){
      phaseEl.textContent='Puis la grande zone'; cycleEl.textContent='';
      if(tc>=T_INTER){ etat='glisse'; t0=now; tc=0; }
    }
    else{ phaseEl.textContent='Zone complète'; cycleEl.textContent='';
      if(tc>=T_FIN) reinit(); }
  }
  requestAnimationFrame(boucle);
  const b=document.getElementById('play');
  b.onclick=()=>{ enPause=!enPause; b.textContent=enPause?'Reprendre':'Pause'; };
  document.getElementById('restart').onclick=reinit;
  document.getElementById('vitesse').oninput=e=>{ vitesse=parseFloat(e.target.value); };
  reinit();
})();

  <div class="etape" id="etape">&nbsp;</div>
  <div class="controls">
    <button id="play">Pause</button>
    <button id="restart" class="ghost">Recommencer</button>
    <label>Vitesse <input type="range" id="vitesse" min="0.5" max="1.8" step="0.1" value="1"></label>
    <label><input type="checkbox" id="toutes"> Voir toutes les zones</label>
  </div>
<script>
(function(){
  const svg=document.getElementById('pieds');
  const NOMS=["Les deux gros orteils", "2ᵉ orteil", "3ᵉ orteil", "4ᵉ orteil", "Petit orteil"], N=NOMS.length;
  const T_MVT=6300;    // durée de référence (orteil moyen)
  const T_PAUSE=620;   // respiration entre deux orteils
  const T_FIN=1500;
  const SEUIL_FIN=0.78;// à partir d'où la zone se fige
  const OP_FIN=0.90;   // état terminé : opacité du SVG

  const zonesTete=['zone-tete-d','zone-tete-g'].map(id=>svg.getElementById(id)).filter(Boolean);
  const autres=Array.from(svg.querySelectorAll('g[id^="zone-"]')).filter(g=>!g.id.startsWith('zone-tete'));
  function appliqueZones(t){ autres.forEach(g=>g.style.display=t?'':'none');
                             zonesTete.forEach(g=>g.style.opacity=0.3); }
  appliqueZones(false);

  // pré-calcul : longueur du tracé, pour synchroniser doigt et traînée
  const Z={};
  ['d','g'].forEach(f=>{ for(let i=0;i<N;i++){
    const tr=svg.getElementById(`tr-${f}-${i}`);
    const L=tr.getTotalLength();
    tr.style.strokeDasharray=L; tr.style.strokeDashoffset=L;
    Z[f+i]={tr,L,fin:svg.getElementById(`fin-${f}-${i}`),dg:svg.getElementById(`dg-${f}-${i}`)};
  }});
  // durée proportionnelle à la longueur du trajet -> vitesse du doigt constante
  // EXP = 1 : vitesse strictement constante · 0 : même durée partout · 0.6 : compromis
  const EXP=1;
  let Lmoy=0; for(let i=0;i<N;i++) Lmoy+=Z['d'+i].L; Lmoy/=N;
  function duree(i){ return T_MVT*Math.pow(Z['d'+i].L/Lmoy,EXP); }

  function reset(){ Object.values(Z).forEach(z=>{
    z.tr.style.strokeDashoffset=z.L; z.tr.style.visibility='hidden';
    z.fin.setAttribute('opacity',0); z.dg.setAttribute('opacity',0); }); }

  function rendu(i,k){
    ['d','g'].forEach(f=>{
      const z=Z[f+i];
      z.tr.style.visibility = k>0.004 ? 'visible' : 'hidden'; // évite le disque fantôme
      z.tr.style.strokeDashoffset=z.L*(1-k);               // la traînée suit
      const p=z.tr.getPointAtLength(z.L*k);                // le doigt est pile en tête
      z.dg.setAttribute('cx',p.x); z.dg.setAttribute('cy',p.y);
      z.dg.setAttribute('opacity', k>0.001 ? 1 : 0);       // doigt opaque
      const kf = k<SEUIL_FIN ? 0 : (k-SEUIL_FIN)/(1-SEUIL_FIN);
      z.fin.setAttribute('opacity', kf*OP_FIN);            // la zone se fige à 90 %
    });
  }
  function fige(i){ ['d','g'].forEach(f=>{ const z=Z[f+i];
    z.tr.style.visibility='visible';
    z.fin.setAttribute('opacity',OP_FIN); z.dg.setAttribute('opacity',0); }); }

  const etapeEl=document.getElementById('etape');
  let i=0, phase='mvt', t0=performance.now(), ecoule=0, enPause=false, vitesse=1;
  reset();

  function boucle(now){
    requestAnimationFrame(boucle);
    if(enPause){ t0=now-ecoule/vitesse; return; }
    ecoule=(now-t0)*vitesse;

    if(phase==='mvt'){
      const k=Math.min(ecoule/duree(i),1);
      etapeEl.textContent=NOMS[i];
      rendu(i,k);
      if(k>=1){ fige(i); phase=(i===N-1)?'fin':'pause'; t0=now; ecoule=0; }
    } else if(phase==='pause'){
      if(ecoule>=T_PAUSE){ i++; phase='mvt'; t0=now; ecoule=0; }
    } else {
      etapeEl.textContent='Zone Tête complète';
      if(ecoule>=T_FIN){ reset(); i=0; phase='mvt'; t0=now; ecoule=0; }
    }
  }
  requestAnimationFrame(boucle);

  const btn=document.getElementById('play');
  btn.onclick=()=>{ enPause=!enPause; btn.textContent=enPause?'Reprendre':'Pause'; };
  document.getElementById('restart').onclick=()=>{ reset(); i=0; phase='mvt'; ecoule=0; t0=performance.now(); };
  document.getElementById('vitesse').oninput=e=>{ vitesse=parseFloat(e.target.value); };
  document.getElementById('toutes').onchange=e=>{ appliqueZones(e.target.checked); };
})();
</script></body></html>

    const o=E[el], dernier = (el===E.length-1);

    if(etat==='glisse'){
      const durAct = (cour.elements.length>1) ? Math.max(T_MIN_EL2, o.d.Lm/(cour.vitesse_el||VITESSE_EL)) : duree;
      const k=Math.min(tc/durAct,1);
      rendu(o,k);
      phaseEl.textContent='Pression glissée'; cycleEl.textContent=libelle();
      if(passe===cour.passages-1 && k>SEUIL_FIN) figeEl(o,(k-SEUIL_FIN)/(1-SEUIL_FIN));
      if(k>=1){ passe++; t0=now; tc=0;
        if(passe>=cour.passages){ figeEl(o,1); ['d','g'].forEach(f=>o[f].dg.setAttribute('opacity',0));
          passe=0; etat = dernier ? 'fin' : 'inter'; }
        else etat='efface'; }
    }
    else if(etat==='efface'){
      ['d','g'].forEach(f=>o[f].dg.setAttribute('opacity',0));
      const e=Math.min(tc/T_EFFACE,1);
      ['d','g'].forEach(f=>{ o[f].tr.style.strokeOpacity=OP_TRAINEE*(1-e); });
      if(e>=1){ resetEl(o); etat='glisse'; t0=now; tc=0; }
    }
    else if(etat==='inter'){
      phaseEl.textContent='Orteil suivant'; cycleEl.textContent='';
      if(tc>=T_INTER){ el++; etat='glisse'; t0=now; tc=0; }
    }
    else{
      phaseEl.textContent='Zone complète'; cycleEl.textContent='';
      if(tc>=T_FIN) reinit();
    }
  }
  sel.onchange=e=>{ prepare(+e.target.value); reinit(); };
  const b=document.getElementById('play');
  b.onclick=()=>{ enPause=!enPause; b.textContent=enPause?'Reprendre':'Pause'; };
  document.getElementById('restart').onclick=reinit;
  document.getElementById('vitesse').oninput=e=>{ vitesse=parseFloat(e.target.value); };
  prepare(0); reinit(); requestAnimationFrame(boucle);
})();
</script></body></html>
